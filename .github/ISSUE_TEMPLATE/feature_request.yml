name: Feature request
description: Suggest an idea for LIA (hardware, firmware, or website)
labels: ['enhancement']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Website / Documentation
        - Firmware
        - Hardware (PCB / schematic)
        - Enclosure
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or frustrating today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
