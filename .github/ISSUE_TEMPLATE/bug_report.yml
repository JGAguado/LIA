name: Bug report
description: Something isn't working as expected (hardware, firmware, or website)
labels: ['bug']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Website / Documentation
        - Firmware
        - Hardware (PCB / schematic)
        - Enclosure
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        For hardware/firmware: board revision, firmware version, region setting.
        For website: browser, OS, page URL.
      placeholder: |
        - Board revision:
        - Firmware version:
        - Browser/OS:
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else that might help.
    validations:
      required: false
