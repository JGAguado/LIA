name: CI

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 1

  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint:md

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run format:check

  check-links:
    name: Check links
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist
      - name: Link the site's /LIA base path to the built output
        # astro build's `base: '/LIA'` config only prefixes hrefs -- it
        # doesn't nest the physical output under an LIA/ folder, so
        # root-relative links like /LIA/docs/... can't resolve against
        # website/dist directly. lychee's --root-dir needs an actual LIA/
        # directory to resolve into.
        run: |
          mkdir -p /tmp/lychee-root
          ln -s "$GITHUB_WORKSPACE/website/dist" /tmp/lychee-root/LIA
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir /tmp/lychee-root
            'website/dist/**/*.html'
          fail: true
