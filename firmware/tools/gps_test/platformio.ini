; Standalone SAM-M10Q bring-up test for LIA v1 -- no Meshtastic, no LoRa, no
; LED. Just powers the GNSS module (PPC high) and prints its position over
; native-USB serial every 10s. See README.md.

[env:lia_v1]
platform = platformio/espressif32@6.13.0
board = lia_v1
framework = arduino
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200

; PlatformIO's espressif32 platform has no board.json "variants_dir" concept
; for ESP32 (that key only exists for the nRF52 platform) -- pins_arduino.h
; is found purely via this plain compiler include path, same as how
; firmware/meshtastic's own platformio.ini resolves its variants/esp32s3/lia_v1.
build_flags =
  -I variants/lia_v1

lib_deps =
  mikalhart/TinyGPSPlus@^1.1.0
