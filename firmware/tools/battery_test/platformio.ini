; Standalone MAX17048 battery gauge bring-up test for LIA v1 -- no
; Meshtastic, no LoRa, no GPS. Just powers I2C and prints the gauge's
; reported charge percentage/voltage over native-USB serial every 2s, via
; two independently-computed read paths side by side. See README.md.

[env:lia_v1]
platform = platformio/espressif32@6.13.0
board = lia_v1
framework = arduino
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200

; PlatformIO's espressif32 platform has no board.json "variants_dir" concept
; for ESP32 (that key only exists for the nRF52 platform) -- pins_arduino.h
; is found purely via this plain compiler include path, same as how
; firmware/meshtastic's own platformio.ini resolves its variants/esp32s3/lia_v1.
build_flags =
  -I variants/lia_v1

lib_deps =
  adafruit/Adafruit MAX1704X@^1.0.3
  adafruit/Adafruit BusIO@^1.17.4
