; LIA v2 -- ESP32-S3-MINI-1-N8 pet tracker board, IMU removed, I2C battery
; gauge (MAX17048) enabled. See variant.h for what differs from lia_v1.
; Private/out-of-tree board (not upstream Meshtastic hardware), hence
; PRIVATE_HW and no custom_meshtastic_* device-list metadata -- see
; firmware/README.md for how this overlay gets applied to a Meshtastic checkout.

[env:lia_v2]
board_level = extra
extends = esp32s3_base
board = lia_v2
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600

build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32s3/lia_v2
